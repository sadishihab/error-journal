[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-error-journal"
version = "0.3.3"
description = "Executa for the error-journal Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-error-journal" = "error_journal_plugin:main"

[tool.setuptools]
py-modules = ["error_journal_plugin"]
